# Configuración local/CLI de Supabase (`supabase start`, `supabase db push`).
# Los valores de [auth] también hay que replicarlos en el dashboard del
# proyecto real: Authentication → Sign In / Providers y Attack Protection.
project_id = "no-te-afanen"

[api]
enabled = true

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
# Misma política que la checklist del formulario (lib/passwordStrength.ts),
# pero aplicada en el servidor: quien llame a la API directo no la saltea.
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = true
# Sin cuenta confirmada no hay sesión (y /admin exige email confirmado).
enable_confirmations = true
double_confirm_changes = true
max_frequency = "60s"

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
